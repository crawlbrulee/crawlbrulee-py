[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crawlbrulee"
version = "0.16.1"
description = "Official Python SDK for crawlbrulee - web-scraping API."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "crawlbrulee" }]
keywords = [
    "crawlbrulee",
    "sdk",
    "scrape",
    "scraping",
    "crawler",
    "web-scraping",
    "screenshot",
    "sitemap",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://crawlbrulee.com"
Repository = "https://github.com/crawlbrulee/crawlbrulee-py"
Issues = "https://github.com/crawlbrulee/crawlbrulee-py/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "pyright>=1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/crawlbrulee"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
