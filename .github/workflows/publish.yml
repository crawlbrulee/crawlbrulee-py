name: Publish to PyPI

# Fires when a version tag is pushed (e.g. `git tag v0.1.0 && git push origin v0.1.0`).
# Tag the commit you want released — tag `vX.Y.Z` must match the version in pyproject.toml.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        # Install into .venv to match the pyright venv config in pyproject.toml.
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"
      - name: Lint
        run: .venv/bin/ruff check .
      - name: Type-check
        run: .venv/bin/pyright
      - name: Test
        run: .venv/bin/pytest

  build:
    name: Build distributions
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify tag matches project version
        # GITHUB_REF_NAME is the pushed tag (e.g. v0.1.0); read as a shell env var, never
        # interpolated into the script body, so it cannot inject shell.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag v$tag does not match pyproject.toml version $version"
            exit 1
          fi
          echo "Releasing version $version"
      - name: Build
        run: |
          pip install build twine
          python -m build
      - name: Check
        run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Trusted Publishing: the PyPI project must list this workflow + environment
    # as a trusted publisher. No API token is stored.
    environment:
      name: pypi
      url: https://pypi.org/project/crawlbrulee/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
